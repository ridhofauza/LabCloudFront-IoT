AWSTemplateFormatVersion: '2010-09-09'
Description:
  Template to deploy Public NLB

Parameters:
  AccountName:
    Description: An account name that is prefixed to resource names. Avoid including "dev", "staging" and "prod" as this will automatically appended based on the selected Environment.
    Type: String
    Default: Test

  EnvironmentName:
    Description: An environment name that is prefixed to resource names.
    Type: String
    AllowedValues:
    - Test
    - Dev
    Default: Test

  EnvironmentTag:
    Description: An environment tagging that is resource tagging.
    Type: String
    AllowedValues:
    - test
    - dev
    Default: test  

  SslPolicy:
    Description: SSL Policy for the NLB Listener
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
  
  CertificateArn:
    Description: ACM Certificate ARN for the NLB Listener
    Type: String
  
  EnableElbAccessLogs:
    Type: String
    Default: true
    AllowedValues: 
      - true
      - false
    Description: Enable ALB/NLB access logging to the ElbLogBucketName bucket


Conditions:
  ElbAccessLogsEnabled: !Equals [!Ref EnableElbAccessLogs, 'true']
  
Resources:

# -------------------------------------------------------------------------
# Create Security Group MQ
# -------------------------------------------------------------------------
  MqNlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow all inbound traffic to the NLB
      VpcId: !ImportValue S0-VPC-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          #SourcePrefixListId: pl-3b927c52 # IPv4 Prefix List CloudFront us-east-1
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: WebSocket broadcast server
        - IpProtocol: tcp
          FromPort: 1883
          ToPort: 1883
          CidrIp: 0.0.0.0/0
          Description: MQTT over TCP
        - IpProtocol: tcp
          FromPort: 8883
          ToPort: 8883
          CidrIp: 0.0.0.0/0
          Description: MQTT over WebSocket
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: "Allow all outbound IPv4 traffic"
      Tags:
          - Key: Name
            Value: !Sub ${EnvironmentName}-${AccountName}-CentralIngress-SG-MQ-NLB
          - Key: Environment
            Value: !Ref EnvironmentTag
          - Key: Purpose
            Value: Central Ingress Security Group for NLB

# -------------------------------------------------------------------------
# Create NLB MQ
# -------------------------------------------------------------------------
  MqNlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
        Name: mq-public-nlb
        Type: network
        Scheme: internet-facing
        SecurityGroups:
          - !Ref MqNlbSecurityGroup
        Subnets:
            - !ImportValue S0-VPC-PublicSubnet1Id
            - !ImportValue S0-VPC-PublicSubnet2Id
        LoadBalancerAttributes:
          - Key: load_balancing.cross_zone.enabled
            Value: "true"
          - !If
            - ElbAccessLogsEnabled
            - Key: access_logs.s3.enabled
              Value: 'true'
            - !Ref AWS::NoValue
          - !If
            - ElbAccessLogsEnabled
            - Key: access_logs.s3.bucket
              Value: !ImportValue ElbLogBucketName
            - !Ref AWS::NoValue
          - !If
            - ElbAccessLogsEnabled
            - Key: access_logs.s3.prefix
              Value: nlb
            - !Ref AWS::NoValue
        Tags:
            - Key: Name
              Value: !Sub ${EnvironmentName}-${AccountName}-MQ-PublicNLB
            - Key: Environment
              Value: !Ref EnvironmentTag
            - Key: Purpose
              Value: Central Ingress Public Network Load Balancer

  # Target group for WebSocket, fronted by CloudFront on 80
  TgWebSocket:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-websocket
      VpcId: !ImportValue S0-VPC-VpcId
      TargetType: instance
      Protocol: TCP
      Port: 8080
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !ImportValue S1-EC2-MQ-InstanceId
          Port: 8080

  # Target group for raw MQTT, tested directly against the NLB (bypasses CloudFront)
  TgRawMqtt:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-mqtt-raw
      VpcId: !ImportValue S0-VPC-VpcId
      TargetType: instance
      Protocol: TCP
      Port: 1883
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !ImportValue S1-EC2-MQ-InstanceId
          Port: 1883
  
  # Target group for MQTT over WebSocket
  TgMqttWs:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-mqtt-ws
      VpcId: !ImportValue S0-VPC-VpcId
      TargetType: instance
      Protocol: TCP
      Port: 8883
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !ImportValue S1-EC2-MQ-InstanceId
          Port: 8883

 # ------------------ LISTENER ---------------------
  ListenerMqttCustom:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MqNlb
      Port: 1883
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TgRawMqtt

  ListenerMqtt443:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MqNlb
      Protocol: TLS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TgMqttWs

  ListenerWs:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MqNlb
      Protocol: TCP
      Port: 8080
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TgWebSocket

Outputs:
  NlbDnsName:
    Value: !GetAtt MqNlb.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-NlbDnsName"